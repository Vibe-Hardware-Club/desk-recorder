; Knob transcriber - the real firmware.
; usage-meter - the ESPHome route is ruled out for this board (no SH8601
; display driver, no PDM-to-SD path). See ../../HARDWARE.md.
;
; Build and flash from this folder:
;   pio run -t upload && pio device monitor
; If upload fails or no port appears, ROTATE THE USB-C PLUG 180 DEGREES.

; This section is empty on purpose. The ${platformio.*} variables in build_flags
; below are only resolvable if it exists, and without it the config fails to
; parse at all: "No section: 'platformio'".
[platformio]

[env:knob]
; NOT plain `espressif32`. PlatformIO's own platform (7.0.1 here) still ships
; Arduino core 2.0.17, whose legacy driver/i2s.h has no `i2s_pdm.h` - the
; first compile failed on exactly that. Waveshare's demo uses the core 3.x
; PDM API, so the firmware follows the vendor rather than translating it into
; a deprecated API. This is the pioarduino community continuation, which is
; where core 3.x actually lives.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; 8MB octal PSRAM
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; S3 native USB: without this the monitor stays silent
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    ; Keep the builder's home directory out of the published binary. Assert and
    ; ESP_LOG macros bake __FILE__ into the image, and without these the strings
    ; of a release build read /Users/<whoever-built-it>/.platformio/... all the
    ; way through. The paths are written as PlatformIO variables rather than as
    ; literals so this works on anyone's machine, not just the one it was added
    ; on. Espressif do the same thing to their own prebuilt libraries, which is
    ; why their paths already show up as //IDF/components/...
    ;
    ; These two directories only. There is no ${platformio.project_dir} to
    ; interpolate - it fails the whole config with "No option 'project_dir'" -
    ; and the project's own sources compile with relative paths regardless.
    -fmacro-prefix-map=${platformio.packages_dir}=/pio
    -fmacro-prefix-map=${platformio.workspace_dir}=/build
